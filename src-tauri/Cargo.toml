[package]
name = "speech-to-text"
version = "0.1.0"
description = "Local-first desktop transcription app"
authors = ["Codex"]
edition = "2021"

[lib]
name = "speech_to_text_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }
cc = "1.2.57"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
cpal = "0.17.3"
fs2 = "0.4.3"
hound = "3.5.1"
libc = "0.2.183"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "rustls"] }
rusqlite = { version = "0.39.0", features = ["bundled", "chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sherpa-onnx = "1.13.5"
sha2 = "0.10.9"
strsim = "0.11.1"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "isomp4", "mp3", "wav"] }
tauri = { version = "2.10.3", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-global-shortcut = "2.3.1"
uuid = { version = "1.22.0", features = ["serde", "v4"] }
unicode-normalization = "0.1.25"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData"] }
whisper-rs = { version = "0.16.0", features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["cuda"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
winreg = "0.56.0"

[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.2", features = ["libei"] }
openblas-src = { version = "0.10.13", default-features = false, features = ["cblas", "static"] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
whisper-rs = "0.16.0"
