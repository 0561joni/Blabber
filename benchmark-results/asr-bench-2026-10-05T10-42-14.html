<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASR benchmark</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f2f1ed; --surface-3: #e9e8e3;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #75736d;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10); --border-2: rgba(11,11,11,.18);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --neg: #e34948; --pos: #2a78d6;
  --good: #0ca30c; --good-text: #006300; --bad: #d03b3b; --bad-text: #b42c2c; --warn: #fab219;
  --hl: #fff4cc; --best: color-mix(in srgb, var(--s1) 12%, var(--surface));
  --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.06);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --surface-3: #2c2c2a;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #9a988f;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --border-2: rgba(255,255,255,.18);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --neg: #e66767; --pos: #3987e5;
    --good-text: #0ca30c; --bad-text: #ee7070; --hl: #4a3d10;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 var(--font); overflow-x: hidden; }
a { color: var(--s1); }
h1 { font-size: 26px; line-height: 1.2; margin: 0 0 4px; letter-spacing: -.01em; }
h2 { font-size: 18px; margin: 0 0 4px; letter-spacing: -.005em; }
h3 { font-size: 14px; margin: 16px 0 6px; }
p { margin: 6px 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
header.top { padding: 28px 0 12px; }
.sub { color: var(--ink-2); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: var(--mono); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; line-height: 18px;
  background: var(--surface-3); color: var(--ink-2); white-space: nowrap; vertical-align: middle; }
.badge.warn { background: color-mix(in srgb, var(--warn) 30%, var(--surface)); color: var(--ink); }
.badge.bad { background: color-mix(in srgb, var(--bad) 20%, var(--surface)); color: var(--ink); }
.badge.info { background: color-mix(in srgb, var(--s1) 16%, var(--surface)); color: var(--ink); }
.meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-top: 16px; }
.meta .kv { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; min-width: 0; }
.kv .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.kv .v { overflow-wrap: anywhere; }
.notice { margin: 12px 0 0; padding: 10px 14px; border-radius: var(--radius); background: color-mix(in srgb, var(--warn) 22%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--warn) 50%, transparent); }
.toc { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 14px 0 0; font-size: 13px; }
.toc a { text-decoration: none; }
.toc a:hover { text-decoration: underline; }
.controls { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--page) 92%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.controls .wrap { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding-top: 8px; padding-bottom: 8px; }
.ctl { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.ctl > span { color: var(--muted); }
select, input[type=search], input[type=text] { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--border-2); border-radius: 7px; padding: 4px 8px; max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--border-2); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--ink-2); padding: 4px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed=true] { background: var(--ink); color: var(--surface); }
button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible, a:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.filter-note { font-size: 12px; color: var(--muted); }
section.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 18px 16px; margin: 18px 0; box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: flex-start; margin-bottom: 10px; }
.card-head .opts { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin: 4px 0 8px; align-items: center; }
.legend .key { display: inline-flex; align-items: center; gap: 5px; }
.legend svg { overflow: visible; }
.chart { width: 100%; position: relative; }
.chart svg { display: block; overflow: visible; }
.chart text { font-family: var(--font); }
.axis text, .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.axis-title { fill: var(--ink-2); font-size: 12px; }
.gridline { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.baseline { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
.hit { fill: transparent; cursor: pointer; outline: none; }
.hit:focus-visible { stroke: var(--s1); stroke-width: 2; }
.empty { padding: 18px; text-align: center; color: var(--muted); border: 1px dashed var(--border-2); border-radius: var(--radius); }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
table { border-collapse: collapse; font-size: 13px; width: 100%; }
th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 11px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.lb th button { font: inherit; text-transform: inherit; letter-spacing: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; white-space: nowrap; }
table.lb th[aria-sort=ascending] button::after { content: " ▲"; font-size: 9px; }
table.lb th[aria-sort=descending] button::after { content: " ▼"; font-size: 9px; }
table.lb td:first-child, table.lb th:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 170px; }
table.lb tr.dim td { color: var(--muted); }
td.best { background: var(--best); font-weight: 600; }
.mname { font-weight: 600; }
.msub { font-size: 11px; color: var(--muted); white-space: nowrap; }
.minibar { height: 4px; border-radius: 0 2px 2px 0; background: var(--s1); margin-top: 3px; margin-left: auto; }
.ci { display: block; font-size: 11px; color: var(--muted); }
.delta-bad { color: var(--bad-text); font-weight: 600; }
.delta-good { color: var(--good-text); font-weight: 600; }
details.tv { margin-top: 10px; }
details.tv > summary { cursor: pointer; font-size: 12px; color: var(--ink-2); }
details.tv table { margin-top: 6px; }
.panels { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.panel { border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; min-width: 0; }
.panel h4 { margin: 0 0 4px; font-size: 13px; }
table.pw { width: auto; }
table.pw td, table.pw th { text-align: center; padding: 4px; min-width: 54px; border: 1px solid var(--surface); }
table.pw th.rowh { text-align: left; white-space: nowrap; font-size: 12px; text-transform: none; letter-spacing: 0; color: var(--ink); }
table.pw td { font-size: 12px; line-height: 1.25; cursor: default; }
table.pw td .p { display: block; font-size: 10px; color: var(--ink-2); }
table.pw td.sig { font-weight: 700; }
table.pw td.diag { background: var(--surface-2); color: var(--muted); }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; }
.explorer { display: grid; grid-template-columns: minmax(250px, 320px) minmax(0, 1fr); gap: 16px; }
.explorer > * { min-width: 0; }
.cliplist { max-height: 720px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius); }
.cliplist h5 { margin: 0; padding: 6px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--surface-2); position: sticky; top: 0; z-index: 1; }
.clipbtn { display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0; border-bottom: 1px solid var(--border); padding: 7px 10px; cursor: pointer; }
.clipbtn:hover { background: var(--surface-2); }
.clipbtn[aria-current=true] { background: color-mix(in srgb, var(--s1) 14%, var(--surface)); }
.clipbtn .row1 { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
.clipbtn .cid { font-weight: 600; font-size: 13px; }
.clipbtn .tags { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.heat { display: flex; gap: 2px; margin-top: 4px; }
.heat i { flex: 1 1 0; height: 8px; border-radius: 2px; min-width: 3px; }
.heat i.na { background: var(--surface-3); }
.heat i.err { background: repeating-linear-gradient(45deg, var(--bad) 0 2px, transparent 2px 4px); }
.clipdetail { min-width: 0; }
.refbox { background: var(--surface-2); border-radius: var(--radius); padding: 10px 12px; margin: 8px 0; }
.seg-lang { border-bottom: 3px solid; padding-bottom: 1px; }
.langchip { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--ink-2); margin: 0 3px 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border-2); }
.out { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin: 8px 0; }
.out-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; }
.out-metrics { font-size: 12px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 2px 12px; }
.diff { margin-top: 6px; line-height: 1.9; overflow-wrap: anywhere; }
.diff.clamp { max-height: 190px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 75%, transparent); mask-image: linear-gradient(#000 75%, transparent); }
.diff del { text-decoration: line-through; text-decoration-thickness: 1.5px; background: color-mix(in srgb, var(--neg) 18%, transparent); color: var(--ink-2); border-radius: 3px; padding: 0 2px; }
.diff ins { text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; background: color-mix(in srgb, var(--good) 22%, transparent); border-radius: 3px; padding: 0 2px; }
.diff .sub { white-space: nowrap; }
.diff .sub del { border-radius: 3px 0 0 3px; } .diff .sub ins { border-radius: 0 3px 3px 0; background: color-mix(in srgb, var(--warn) 34%, transparent); }
.errbox { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); border-radius: 8px; padding: 6px 10px; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.linkbtn { font: inherit; font-size: 12px; background: none; border: 0; color: var(--s1); cursor: pointer; padding: 0; }
.worst { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.worst button { font: inherit; font-size: 13px; text-align: left; background: none; border: 0; border-radius: 6px; padding: 3px 6px; cursor: pointer; color: var(--ink); display: flex; justify-content: space-between; gap: 8px; }
.worst button:hover { background: var(--surface-2); }
.list-compact { margin: 4px 0; padding-left: 18px; font-size: 13px; }
footer { padding: 18px 0 40px; color: var(--ink-2); font-size: 13px; }
footer dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 8px 0; }
footer dt { font-weight: 600; color: var(--ink); }
footer dd { margin: 0; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--border-2);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: var(--shadow); max-width: 300px; display: none; }
#tip .tt { font-weight: 600; margin-bottom: 4px; }
#tip .tr { display: flex; justify-content: space-between; gap: 14px; }
#tip .tr b { font-variant-numeric: tabular-nums; }
#tip .tr span { color: var(--ink-2); }
@media (max-width: 760px) {
  .explorer { grid-template-columns: minmax(0, 1fr); }
  .cliplist { max-height: 320px; }
  h1 { font-size: 22px; }
  section.card { padding: 14px 12px; border-radius: 12px; }
  table.lb td:first-child, table.lb th:first-child { min-width: 130px; }
  footer dl { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .filter-note, .ctl > span { display: none; }
  .controls .wrap { gap: 6px 8px; padding-top: 6px; padding-bottom: 6px; }
}
@media print { .controls { position: static; } section.card { box-shadow: none; break-inside: avoid; } }
</style>

    if (!isNum(w)) return h("i", { class: "na", title: `${m.name}: ${r?.scores ? (r.scores.textOnSilence ? "text on silence" : "no reference words") : "not run"}` });
    return h("i", { style: { background: heatColor(w) }, title: `${m.name}: ${fmtPct(w)}` });
  }));
  return h("button", { type: "button", class: "clipbtn", role: "listitem", "aria-current": String(c.id === state.clip),
    onclick: () => { state.clip = c.id; renderExplorer(); const d = $("#sec-explorer .clipdetail"); if (d && window.innerWidth < 760) d.scrollIntoView({ block: "start", behavior: "smooth" }); } },
  h("div", { class: "row1" }, h("span", { class: "cid", text: c.id }), h("span", { class: "small muted num", text: fmtMs(c.durationMs) })),

}
function renderClipDetail(el, ms) {
  const c = clipById.get(state.clip);
  if (!c) return;
  append(el, h("h3", { style: { marginTop: 0 } }, c.id, " ", h("span", { class: "badge", text: LANG_NAME[c.language] || c.language }), " ",
    h("span", { class: "badge", text: c.category }), c.condition ? [" ", h("span", { class: "badge warn", text: c.condition })] : null),
  h("div", { class: "small muted", text: `${fmtMs(c.durationMs)} · ${fmtInt(c.referenceWords)} reference words${c.script ? " · script " + c.script : ""}${(c.tags || []).length ? " · " + c.tags.join(", ") : ""}` }));

  }

  if (Array.isArray(c.segments) && c.segments.length) {
    const p = h("div");
    c.segments.forEach((sg) => append(p, h("span", { class: "langchip", text: sg.lang }), h("span", { class: "seg-lang", lang: sg.lang, style: { borderColor: LANG_COLOR[sg.lang] || "var(--axis)" }, text: sg.text }), " "));
    ref.append(p);
  } else ref.append(h("div", { text: c.reference || "(empty reference: no speech expected)" }));
  el.append(ref);
  if ((c.terms || []).length) el.append(h("div", { class: "chips", style: { marginBottom: "8px" } }, h("span", { class: "small muted", text: "Terms:" }), c.terms.map((t) => h("span", { class: "chip", text: t }))));
  const outs = ms.map((m) => ({ m, r: rowIndex.get(`${m.id}|${state.mode}|${c.id}`) })).filter((x) => x.r);
  outs.sort((a, b) => (a.r.scores?.normalised?.rate ?? (a.r.error ? 99 : 98)) - (b.r.scores?.normalised?.rate ?? (b.r.error ? 99 : 98)));
  if (!outs.length) el.append(emptyBox("No model ran this clip in " + state.mode + " mode."));
  for (const { m, r } of outs) el.append(outputCard(m, r, c));
  const notRun = ms.filter((m) => !rowIndex.has(`${m.id}|${state.mode}|${c.id}`));
  if (notRun.length) el.append(h("p", { class: "small muted", text: "Not run on this clip: " + notRun.map((m) => {
    const sk = (m.skippedClips || []).find((x) => x.clip === c.id);

}
function outputCard(m, r, c) {
  const card = h("div", { class: "out" });
  const sc = r.scores, t = r.timings || {};
  const flags = [];
  if (sc?.repetitionLoop) flags.push("repetition loop");
  if ((sc?.insertionBurst || 0) >= 5) flags.push(`insertion burst (${sc.insertionBurst} words)`);
  if (sc?.textOnSilence) flags.push("text on silence");
  if (r.languageCorrect === false) flags.push(`language detected: ${r.detectedLanguage || "?"}`);
  card.append(h("div", { class: "out-head" },
    h("div", null, h("span", { class: "mname", text: m.name || m.id }), " ", isStreaming(m) ? h("span", { class: "badge info", text: isDerived(m) ? "preview" : "streaming" }) : null,
      flags.map((f) => [" ", h("span", { class: "badge bad", text: "⚠ " + f })])),
    sc ? h("b", { class: "num", text: "WER " + fmtPct(sc.normalised?.rate) }) : null));
  if (r.error) card.append(h("div", { class: "errbox", text: r.error }));
  if (sc) {
    const n = sc.normalised || {};
    card.append(h("div", { class: "out-metrics" },
      h("span", { text: `S/D/I ${n.substitutions}/${n.deletions}/${n.insertions}` }),
      h("span", { text: "formatted " + fmtPct(sc.formatted?.rate) }),
      sc.termsTotal ? h("span", { text: `terms ${sc.termsFound}/${sc.termsTotal}` }) : null,
      sc.numbersTotal ? h("span", { text: `numbers ${sc.numbersCorrect}/${sc.numbersTotal}` }) : null,
      isNum(t.releaseToTextMs) ? h("span", { text: "release → text " + fmtMs(t.releaseToTextMs) }) : null,
      isNum(t.releaseToTextEarlyMs) ? h("span", { text: "with early ASR " + fmtMs(t.releaseToTextEarlyMs) }) : null,
      isNum(t.firstWordMs) ? h("span", { text: "first word " + fmtMs(t.firstWordMs) }) : null,
      isNum(t.rtf) ? h("span", { text: "RTF " + fmtRtf(t.rtf) }) : null,
      r.detectedLanguage ? h("span", { text: "lang " + r.detectedLanguage }) : null));
  }
  if (Array.isArray(r.alignment) && r.alignment.length) {
    const diff = h("div", { class: "diff" + (r.alignment.length > 120 ? " clamp" : "") }, alignmentNodes(r.alignment));
    card.append(diff);
    if (r.alignment.length > 120) card.append(h("button", { type: "button", class: "linkbtn", text: "Show full diff", onclick: (e) => { diff.classList.toggle("clamp"); e.target.textContent = diff.classList.contains("clamp") ? "Show full diff" : "Collapse"; } }));
  } else if (!r.error) card.append(h("div", { class: "diff", text: r.text ? r.text : "(no text)" }));
  if (r.text) card.append(h("details", null, h("summary", { class: "small muted", text: "Formatted output" }), h("div", { class: "small", style: { marginTop: "4px" }, lang: c.languages?.[0] || null, text: r.text })));

}
function alignmentNodes(al) {
  const out = [];
  for (const [op, ref, hyp] of al) {
    if (op === "=") out.push(ref ?? hyp ?? "");
    else if (op === "S") out.push(h("span", { class: "sub", title: `substitution: “${ref}” → “${hyp}”` }, h("del", { text: ref }), h("ins", { text: hyp })));
    else if (op === "D") out.push(h("del", { title: "deleted reference word", text: ref }));
    else if (op === "I") out.push(h("ins", { title: "inserted word", text: hyp }));
    out.push(" ");
  }
  return out;
}
function renderWorst(ms) {
  const wrap = h("div", { style: { marginTop: "18px" } });
  if (!ms.length) return wrap;
  if (!state.worstModel || !ms.some((m) => m.id === state.worstModel)) state.worstModel = ms[0].id;
  const sel = h("select", { "aria-label": "Model for worst clips", onchange: (e) => { state.worstModel = e.target.value; renderExplorer(); } },
    ms.map((m) => h("option", { value: m.id, selected: m.id === state.worstModel, text: m.name || m.id })));
  wrap.append(h("div", { class: "ctl" }, h("h3", { style: { margin: 0 }, text: "Worst clips for" }), sel));
  const rows = filteredRows(state.worstModel, state.mode, curFilter())
    .map((r) => ({ r, w: r.scores?.normalised?.rate, bad: r.error || r.scores?.textOnSilence || r.scores?.repetitionLoop }))
    .filter((x) => isNum(x.w) || x.bad)
    .sort((a, b) => (b.bad ? 1 : 0) - (a.bad ? 1 : 0) || (b.w ?? 0) - (a.w ?? 0)).slice(0, 8);
  const list = h("div", { class: "worst" }, rows.map(({ r, w }) => h("button", { type: "button", onclick: () => { state.clip = r.clip; renderExplorer(); $("#sec-explorer").scrollIntoView({ behavior: "smooth" }); } },
    h("span", null, h("span", { class: "mono", text: r.clip }), r.error ? h("span", { class: "badge bad", text: " failed" }) : r.scores?.textOnSilence ? h("span", { class: "badge bad", text: " text on silence" }) : r.scores?.repetitionLoop ? h("span", { class: "badge bad", text: " repetition loop" }) : null),
    h("span", { class: "num", text: isNum(w) ? fmtPct(w) + ` (${r.scores.normalised.substitutions}/${r.scores.normalised.deletions}/${r.scores.normalised.insertions})` : "—" }))));
  wrap.append(rows.length ? list : emptyBox("No scored clips for this model and filter."));

}

/* ---------------------------------------------------------------- models detail */
function renderModels() {
  const sec = clear($("#sec-models"));
  sec.append(sectionHead(sec, "h-models", "Models", "Load times, memory, errors and skipped clips. Not affected by the filters."));
  if (!D.models.length) { sec.append(emptyBox("No models.")); return; }
  sec.append(h("div", { class: "scroll-x" }, h("table", null,
    h("thead", null, h("tr", null, ["Model", "Engine", "Size", "Cold load", "Warm load", "CoreML compile", "Peak memory", "Wired Δ", "Errors", "Skipped"].map((t, i) => h("th", { class: i > 1 ? "n" : null, text: t })))),
    h("tbody", null, D.models.map((m) => h("tr", null,
      h("td", null, h("div", { class: "mname", text: m.name || m.id }), h("div", { class: "msub mono", text: m.id + (m.appModelId && m.appModelId !== m.id ? " · " + m.appModelId : "") }),
        m.derivedFrom ? h("div", { class: "msub", text: "derived from " + m.derivedFrom + " (same runs, live preview text)" }) : null),
      h("td", { style: { whiteSpace: "nowrap" } }, m.engine || "—", h("div", { class: "msub", text: m.kind || "" })),
      h("td", { class: "n", text: fmtBytes(m.sizeBytes) }),
      h("td", { class: "n" }, fmtMs(m.load?.coldMs), m.load?.perTranscription ? h("span", { class: "ci", text: "worker per transcription" }) : null),
      h("td", { class: "n", text: fmtMs(m.load?.warmMs) }),
      h("td", { class: "n", text: fmtMs(m.load?.coremlCompileMs) }),
      h("td", { class: "n", text: fmtBytes(m.peakMemoryBytes) }),
      h("td", { class: "n", text: fmtBytes(m.wiredDeltaBytes) }),
      h("td", { class: "n" + ((m.errors || []).length ? " delta-bad" : ""), text: String((m.errors || []).length) }),
      h("td", { class: "n", text: String((m.skippedClips || []).length) })))))));
  const per = D.models.filter((m) => m.load?.perTranscription);
  if (per.length) sec.append(h("p", { class: "small muted", text: `${per.map((m) => m.name).join(", ")} start a worker for every transcription, so model loading is included in each of their timings (release → text and RTF).` }));
  const ane = D.models.filter((m) => isNum(m.wiredDeltaBytes));
  if (ane.length) sec.append(h("p", { class: "small muted", text: "Wired Δ: peak system wired-memory increase while the model ran (Neural Engine models keep weights in wired memory, which phys_footprint does not show)." }));
  for (const m of D.models) {

      errs.length ? h("ul", { class: "list-compact" }, errs.map((e) => h("li", null, h("span", { class: "mono", text: e.clip || "(model)" }), ": ", e.message))) : null,
      sk.length ? h("ul", { class: "list-compact" }, Object.entries(reasons).map(([why, ids]) => h("li", null, why, ": ", h("span", { class: "mono small", text: ids.join(", ") })))) : null));
  }
}

/* ---------------------------------------------------------------- footer */
function renderFooter() {
  const f = clear($("#footer"));
  const dl = h("dl");
  const item = (k, v) => append(dl, h("dt", { text: k }), h("dd", { text: v }));
  item("WER", "(S + D + I) ÷ N, on normalised text (case, punctuation, number spelling and umlauts folded; normaliser " + (D.run.normalisationVersion || "—") + "). Pooled = Σ errors ÷ Σ reference words; macro = mean of per-clip WER.");
  item("Formatted", "The same error rate with case and punctuation kept, closer to what gets pasted.");
  item("Release → text", "Batch models: wall time of a warm transcription of the whole short clip. Streaming models: audio is fed at real-time pace (paced runs), then the time from the end of audio to the final text. Early-ASR figures simulate the app's windowed transcription for dictations over 31 s.");
  item("RTF", "Median compute wall time ÷ audio duration (unpaced). 0.05× = 20× faster than real time.");
  item("CI", "95 % bootstrap interval over clips (pooled WER, whole clips resampled).");
  item("p-values", "Paired bootstrap on the clips both models scored; p < 0.05 marks a difference unlikely to be chance for this corpus.");
  item("Hallucinations", "Rows with text on silence, a repeated-n-gram loop, or a burst of ≥ 5 inserted words.");
  append(f, h("h3", { text: "How to read this report" }), dl, h("p", { class: "muted" }, "Generated by blabber-bench", D.run.id ? " · run " + D.run.id : ""));

/* ---------------------------------------------------------------- orchestration */
function safe(fn, el) {

    console.error(e);
    if (el) append(clear(el), h("div", { class: "errbox", text: "This section failed to render: " + (e && e.message ? e.message : e) }));
  }
}
function renderFiltered() {
  updateFilterNote();
  safe(renderScatter, $("#sec-scatter"));
  safe(renderLeaderboard, $("#sec-board"));
  safe(renderBreakdown, $("#sec-breakdown"));
  safe(renderConditions, $("#sec-conditions"));
  safe(renderPairwise, $("#sec-pairwise"));
  safe(renderLatency, $("#sec-latency"));
  safe(renderExplorer, $("#sec-explorer"));
}
function renderAll() {
  safe(renderHeader, $("#hdr"));
  safe(renderControls, $("#controls"));
  renderFiltered();
  safe(renderModels, $("#sec-models"));
  safe(renderFooter, $("#footer"));
}
renderAll();
let lastW = window.innerWidth;
window.addEventListener("resize", debounce(() => {
  if (window.innerWidth === lastW) return;
